# ---------------------------------------------------------------------------
# 规则（本地优先，然后按清单顺序）
# ---------------------------------------------------------------------------
rules:
  # ── [filter_local] 本机 / 内网
  - 'DOMAIN-SUFFIX,local,DIRECT'
  - 'IP-CIDR,192.168.0.0/16,DIRECT,no-resolve'
  - 'IP-CIDR,10.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,172.16.0.0/12,DIRECT,no-resolve'
  - 'IP-CIDR,127.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,100.64.0.0/10,DIRECT,no-resolve'
  - 'IP-CIDR,224.0.0.0/4,DIRECT,no-resolve'
  - 'IP-CIDR,169.254.0.0/16,DIRECT,no-resolve'
  - 'IP-CIDR6,fe80::/10,DIRECT,no-resolve'
  - 'IP-CIDR6,fc00::/7,DIRECT,no-resolve'
  - 'IP-CIDR6,ff00::/8,DIRECT,no-resolve'
  - 'IP-CIDR6,::1/128,DIRECT,no-resolve'

  # 局域网 / 路由器管理域名
  - 'RULE-SET,private,DIRECT'

  # ── 本地修正（优先于远程清单）
  - 'DOMAIN-SUFFIX,sentry.io,DIRECT'
  - 'DOMAIN-SUFFIX,crashlytics.com,DIRECT'
  - 'DOMAIN-SUFFIX,apps.mzstatic.com,DIRECT'
  - 'DOMAIN-SUFFIX,akadns.net,DIRECT'

  # ── 国内站由 cncidr + .cn + GEOIP 三层兜底，不逐个加白名单

  # ── NTP 直连（UDP 123 经代理常不通）
  - 'DOMAIN,time.apple.com,DIRECT'
  - 'DOMAIN,time-ios.apple.com,DIRECT'
  - 'DOMAIN,time-macos.apple.com,DIRECT'

  # ── digicert：只把 Apple 的 OCSP/CRL 送「苹果服务」，其余直连
  - 'DOMAIN,ocsp.digicert.com,🍎 苹果服务'
  - 'DOMAIN,crl3.digicert.com,🍎 苹果服务'
  - 'DOMAIN,crl4.digicert.com,🍎 苹果服务'
  - 'DOMAIN,cacerts.digicert.com,🍎 苹果服务'
  - 'DOMAIN-SUFFIX,digicert.com,DIRECT'

  # ── 反劫持清单误伤的正规厂商（直连）
  - 'DOMAIN-SUFFIX,ultraiso.net,DIRECT'
  - 'DOMAIN-SUFFIX,coreldrawchina.com,DIRECT'
  - 'DOMAIN-SUFFIX,huishenghuiying.com.cn,DIRECT'
  - 'DOMAIN-SUFFIX,ediuschina.com,DIRECT'
  - 'DOMAIN-SUFFIX,flstudiochina.com,DIRECT'
  - 'DOMAIN-SUFFIX,guitarpro.cc,DIRECT'
  - 'DOMAIN-SUFFIX,earmasterchina.cn,DIRECT'
  - 'DOMAIN-SUFFIX,mathtype.cn,DIRECT'
  - 'DOMAIN-SUFFIX,mindmanager.cn,DIRECT'
