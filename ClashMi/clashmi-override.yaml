    - '*.*.xboxlive.com'
    - '+.services.googleapis.cn'
    - 'WORKGROUP'
  # 引导 DNS：只用于解析下面「域名形式」的 DoH；纯 IP 写法用不到它
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
    - system                      # 公司网/酒店网常只放行内网 DNS
  # 主 DNS：主流做法是「加密 + 明文 + 系统」混合，一层被拦还有下一层
  # 顺序：IP 形式 DoH（不需要引导）→ 域名形式 DoH → 明文 → 系统
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - 223.5.5.5
    - 119.29.29.29
    - system
  # 节点域名解析：节点域名被污染会让整份订阅不可用
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
    - 223.5.5.5
    - 119.29.29.29
  # DIRECT 出口单独指定解析（不填则跟随 nameserver）
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - 223.5.5.5
    - system
  direct-nameserver-follow-policy: false
  use-hosts: true
  use-system-hosts: true
  cache-algorithm: arc
  prefer-h3: false                # 网络封 QUIC 时不要额外等 DoH-H3
  respect-rules: false
  nameserver-policy:
    # Google 下载/更新走国内 CDN
    '+.dl.google.com': [https://223.5.5.5/dns-query, 223.5.5.5]
    '+.dl.l.google.com': [https://223.5.5.5/dns-query, 223.5.5.5]
    '+.update.googleapis.com': [https://223.5.5.5/dns-query, 223.5.5.5]
    '+.clientservices.googleapis.com': [https://223.5.5.5/dns-query, 223.5.5.5]

# ---------------------------------------------------------------------------
# 嗅探
# Clash Mi 在「自定义覆写」下写 Sniffer: null（App 的嗅探开关不生效），
# 所以必须写在这里，否则用自身 DNS/HTTPDNS 的 App 只能按 IP 匹配规则。
# ---------------------------------------------------------------------------
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false     # 只嗅探不改写目标，避免误伤
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - '+.push.apple.com'
    - 'Mijia Cloud'
